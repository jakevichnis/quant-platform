syntax = "proto3";

package execution;

// execution's job is to place orders and report what happened

// the states are: submitted, partial, filled, cancelled, rejected

enum OrderState {
	ORDER_STATE_UNSPECIFIED = 0;
	ORDER_STATE_SUBMITTED = 1;
	ORDER_STATE_PARTIAL = 2;
	ORDER_STATE_FILLED = 3;
	ORDER_STATE_CANCELLED = 4;
	ORDER_STATE_REJECTED = 5;
}

message OrderUpdate {
	string trade_id = 1;
	string symbol = 2;
	OrderState order_state = 3;
	int64 shares_ordered = 4;
	int64 shares_filled = 5;
	double average_price = 6;
}

enum OrderSide {
	ORDER_SIDE_UNSPECIFIED = 0;
	ORDER_SIDE_BUY = 1;
	ORDER_SIDE_SELL = 2;
}


message OrderRequest {
	string trade_id = 1;
	string symbol = 2;
	int64 shares_ordered = 3;
	double limit_price = 4;		// a 0 will mean "market order, no limit"
	OrderSide order_side = 5;	// BUY or SELL
}



service Execution {
	rpc PlaceOrder(OrderRequest) returns (stream OrderUpdate);
}

